<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vectralab.cloud</title>
<style>
  :root {
    --bg: #f6f5f0;
    --bg-card: #ffffff;
    --text: #24291f;
    --text-muted: #5c6357;
    --accent: #3f6e4e;
    --border: #dfe2d8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1e18;
      --bg-card: #23271f;
      --text: #e9ebe3;
      --text-muted: #a9b09e;
      --accent: #7fb894;
      --border: #343a2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 40px 44px;
    text-align: center;
    max-width: 420px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 1.6rem;
    color: var(--accent);
  }
  p {
    margin: 0 0 24px;
    color: var(--text-muted);
    font-size: 0.95rem;
  }
  a.link {
    display: inline-block;
    text-decoration: none;
    background: var(--accent);
    color: var(--bg-card);
    padding: 10px 22px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>vectralab.cloud</h1>
    <p>Página inicial em construção.</p>
    <a class="link" href="/cardapio/">Ver cardápio</a>
  </div>
</body>
</html>
